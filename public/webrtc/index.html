<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Check which network addresses WebRTC exposes.">
  <meta name="theme-color" content="#f0f2f5">
  <title>WebRTC Leak Test | Privacy Checker</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/webrtc/check.js"></script>
  <script type="module" src="/site-match.js"></script>
</head>
<body>
  <div id="site-content">
    <header class="topbar">
      <div class="shell bar-inner">
        <a class="brand" href="/"><img src="/mark.svg" alt="" width="23" height="23"> Privacy Checker</a>
        <nav aria-label="Site navigation">
          <a href="/#connection">IP address</a>
          <a href="/#tests">Tests</a>
        </nav>
      </div>
    </header>
    <main class="shell">
      <header class="test-intro">
        <h1>WebRTC leak test</h1>
        <p>See which network addresses your browser exposes when it tries to establish a peer connection. The check uses Cloudflare STUN.</p>
      </header>
      <section class="panel probe" aria-labelledby="rtc-title">
        <div class="panel-heading"><h2 id="rtc-title">Observed addresses</h2><span class="status" id="rtc-status" role="status">Ready</span></div>
        <div class="probe-body">
          <button class="button" id="run-rtc" type="button">Run WebRTC check</button>
          <ul class="result-list" id="rtc-results" aria-live="polite"></ul>
          <p class="probe-message" id="rtc-message" aria-live="polite"></p>
        </div>
      </section>
      <noscript><p>Enable JavaScript to run the checks.</p></noscript>
    </main>
    <footer class="shell footer">
      <div>
        <p>Made by <strong>SimonLM</strong></p>
        <p>Privacy is a fundamental human right to us all.</p>
      </div>
      <a href="https://github.com/masalaempire/privacychecker">Source code</a>
    </footer>
  </div>
</body>
</html>
